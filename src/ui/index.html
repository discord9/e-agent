<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>e-agent · Web UI</title>
<!-- favicon：内联 SVG data URI（零路由改动、无额外请求）。「e_」标记 =
     e-agent 的 e + 终端光标/输入提示符的下划线。像素风：64×64 viewBox
     按 4 单位/格铺成 16×16 网格，16px 渲染时每格恰好 1 物理像素、无抗
     锯齿模糊。Solarized 绿（#859900）小写 e 居中偏上为主体：左竖 +
     顶/中/底三横，顶/底横右端出头 1 格、中横短 2 格（右侧上下双开口，
     读作小写 e、刻意避开圆环以免像 IE）；其下留 1 格间隙，Solarized 橙
     （#cb4b16，与品牌 busy dot 同色）1 格高、与 e 等宽的下划线收尾，
     整体垂直居中。全部矩形构成，落在 base2（#eee8d5）圆角底上；
     16px 小尺寸下 e 的开口与下划线均可辨识、互不粘连。 -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http://www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%23eee8d5%27/%3E%3Cg%20fill%3D%27%23859900%27%3E%3Crect%20x%3D%2720%27%20y%3D%2712%27%20width%3D%2732%27%20height%3D%274%27/%3E%3Crect%20x%3D%2720%27%20y%3D%2716%27%20width%3D%274%27%20height%3D%274%27/%3E%3Crect%20x%3D%2720%27%20y%3D%2720%27%20width%3D%274%27%20height%3D%274%27/%3E%3Crect%20x%3D%2720%27%20y%3D%2724%27%20width%3D%2724%27%20height%3D%274%27/%3E%3Crect%20x%3D%2720%27%20y%3D%2728%27%20width%3D%274%27%20height%3D%274%27/%3E%3Crect%20x%3D%2720%27%20y%3D%2732%27%20width%3D%274%27%20height%3D%274%27/%3E%3Crect%20x%3D%2720%27%20y%3D%2736%27%20width%3D%2732%27%20height%3D%274%27/%3E%3C/g%3E%3Cg%20fill%3D%27%23cb4b16%27%3E%3Crect%20x%3D%2716%27%20y%3D%2744%27%20width%3D%2732%27%20height%3D%274%27/%3E%3C/g%3E%3C/svg%3E">
<style>/*__KATEX_CSS__*/
/*__CSS__*/</style>
</head>
<body>

<header id="topbar">
  <button id="sidebarBtn" title="会话侧边栏">☰</button>
  <div class="brand">e-agent<span class="dot">●</span></div>
  <div class="top-actions" id="topActions" hidden>
    <button id="backParentBtn" title="返回主会话" hidden>← 主会话</button>
    <select id="workspaceSelect" title="切换服务器实例"></select>
    <button id="workspaceAddBtn" type="button" class="ws-btn" title="添加服务器实例">+</button>
    <button id="workspaceRemoveBtn" type="button" class="ws-btn danger" title="删除当前服务器实例" disabled>×</button>
    <span id="connState" class="conn-state"></span>
  </div>
  <!-- 添加服务器实例的内联编辑面板：点「+」展开，保存后立即激活新实例 -->
  <div id="workspaceEditor" class="ws-editor" hidden>
    <input id="wsNameInput" placeholder="名称" autocomplete="off" spellcheck="false">
    <input id="wsUrlInput" placeholder="URL（留空 = 同源）" autocomplete="off" spellcheck="false">
    <input id="wsTokenInput" type="password" placeholder="Token（可选）" autocomplete="off" spellcheck="false">
    <button id="wsSaveBtn" type="button" class="primary">保存</button>
    <button id="wsCancelBtn" type="button">取消</button>
  </div>
  <div class="token-box">
    <!-- 默认折叠成小按钮：点击展开输入框，再点 / Esc / 失焦收起（app.js） -->
    <button id="tokenToggle" type="button" class="token-toggle" title="点击展开 Token 输入"></button>
    <input id="tokenInput" type="password" placeholder="访问令牌（Bearer）" autocomplete="off" spellcheck="false" hidden>
  </div>
</header>

<!-- ============ 应用主体：侧边栏与内容区 flex 并排（桌面挤压式，手机覆盖式） ============ -->
<div id="appBody">
  <!-- 手机遮罩：桌面 display:none（见 style.css 媒体查询） -->
  <div id="sidebarOverlay" hidden></div>

  <!-- ============ 会话侧边栏（会话树） ============ -->
  <aside id="sidebar" hidden>
  <div class="sidebar-head">
    <h2>会话</h2>
    <button id="sidebarCloseBtn" title="关闭">×</button>
  </div>
  <div class="sidebar-filter">
    <input id="sidebarFilter" type="search" placeholder="筛选标题 / ID…" autocomplete="off" spellcheck="false">
  </div>
  <div id="sidebarTree" class="sidebar-tree"></div>
</aside>

<!-- ============ 内容区（banner 随内容走，不跟侧边栏） ============ -->
<div id="contentWrap">
  <div id="banner" class="banner" hidden><span id="bannerText" class="banner-text"></span><button id="bannerClose" class="banner-close" title="关闭提示">×</button></div>

<!-- ============ 对话视图 ============ -->
<main id="chatView" class="view no-session">
  <div class="chat-head">
    <span id="chatSessionId" class="dim chat-session-id"></span>
    <span id="chatStatus" class="status-chip idle">空闲</span>
    <span id="usageInfo" class="dim"></span>
    <!-- 压缩是低频操作：放顶部信息栏最右侧，避免与取消/发送相邻误触 -->
    <button id="compactBtn" class="compact-head" title="压缩上下文（释放 token）">压缩</button>
  </div>
  <div id="chatEmpty" class="chat-empty" role="status">
    <strong>从侧边栏选择会话</strong>
    <span>打开已有会话，或使用服务器分组旁的 “+” 新建会话。</span>
  </div>
  <div id="messages" class="messages">
  </div>
  <!-- 回到底部按钮：chatView 的直接子节点（absolute 钉在聊天区右下，
       不随 messages 滚动；在 messages 内会被滚动带走） -->
  <button id="jumpBottomBtn" class="jump-bottom" title="回到底部" hidden>↓</button>
  <div class="composer">
    <!-- 运行中任务折叠条 + 面板（TUI 式）：输入区上方、queueBar 同区域；
         默认收起，有任务时计数高亮（计数即徽标），点击展开面板。
         任务行由 renderTaskList 渲染：bash 行展开后轮询 output 端点，
         delegate 行展开后内嵌 SSE 流式输出（不切走会话）。 -->
    <div id="tasksToggleBar" class="tasks-toggle-bar" hidden title="运行中任务：点击展开 / 收起">
      <span class="tasks-toggle-label">运行中任务 (0)</span>
      <span class="tasks-toggle-chevron"></span>
    </div>
    <div id="composerTasks" class="composer-tasks" hidden></div>
    <div id="queueBar" class="queue-bar" hidden></div>
    <!-- 斜杠命令补全菜单：输入框上方浮出（absolute 定位在 composer 内），
         输入 / 且是命令起始时弹出，↑↓ 选择、Enter/Tab 填入、Esc 关闭 -->
    <div id="slashMenu" class="slash-menu" hidden></div>
    <!-- fork 面板：/fork 命令弹出的历史边界消息选择（absolute 定位在
         composer 内，与 slash 菜单同风格；选中一项 → POST /fork 建新会话） -->
    <div id="forkMenu" class="fork-menu" hidden></div>
    <textarea id="promptInput" rows="1" placeholder="输入消息：Enter 发送，Shift+Enter 换行…" title="支持斜杠命令：/compact 压缩上下文；/rename &lt;标题&gt; 重命名（留空可清除）；/btw &lt;问题&gt; 旁路子代理"></textarea>
    <div class="composer-foot">
      <div id="composerMeta" class="composer-meta" hidden></div>
      <div class="composer-actions">
        <button id="cancelBtn" disabled title="取消当前回合">取消</button>
        <button id="sendBtn" class="primary">发送</button>
      </div>
    </div>
  </div>
</main>
</div><!-- /#contentWrap -->
</div><!-- /#appBody -->

<!--__PET__-->
<script>/*__JS_VENDOR__*/</script>

<script>/*__JS_APP__*/</script>
</body>
</html>
