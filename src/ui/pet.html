<!-- ============ DeepSeek 蓝鲸桌宠（官方 SVG + 可拖拽） ============
     SVG path 来自 simple-icons 的 deepseek 图标（MIT, 24x24 官方鲸鱼造型）。
     可拖拽移动（pointer events, localStorage 记忆位置）；点击互动；
     hover 出现关闭按钮。 -->
<div id="petWhale" class="pet-whale" title="DeepSeek 蓝鲸 · 拖我走，点我玩！">
  <div class="pet-motion">
    <div class="pet-turn">
      <svg viewBox="0 0 24 24" class="pet-whale-svg" aria-hidden="true">

    </div>
    <span class="pet-bubble b1" aria-hidden="true"></span>
    <span class="pet-bubble b2" aria-hidden="true"></span>
    <span class="pet-bubble b3" aria-hidden="true"></span>
  </div>
  <button id="petClose" class="pet-close" title="关掉蓝鲸" aria-label="关掉蓝鲸">×</button>

<style>
/* ============ DeepSeek 蓝鲸桌宠样式 ============ */
.pet-whale {
  position: fixed;
  right: 18px;
  bottom: 16px;
  width: 90px;
  height: 90px;
  z-index: 9999;
  cursor: grab;
  user-select: none;
  touch-action: none;          /* 拖拽：禁默认触摸滚动 */
}
/* 把游动与 fixed 定位分层，拖拽读取位置时不会带入动画位移。 */
.pet-motion {
  position: relative;
  width: 100%;
  height: 100%;
  transform-origin: 50% 56%;
  transform-style: preserve-3d;
  animation: pet-swim 5.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
  will-change: transform;
}
.pet-turn {
  width: 100%;
  height: 100%;
  transform-origin: 58% 52%;
  transform-style: preserve-3d;
  transition: transform 260ms ease-out;
}
.pet-whale-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
  transform-origin: center;
  animation: pet-breathe 3.8s ease-in-out infinite;
}
/* 整体轻微摆动（尾巴侧是左边，绕中心微转） */
.pet-body {
  transform-box: view-box;
  transform-origin: 12px 12px;
  animation: pet-wag 1.8s ease-in-out infinite;
}
/* 悬停时游快一点，同时轻轻转头看向用户。 */
.pet-whale:hover:not(.dragging):not(.startled) .pet-motion { animation-duration: 3.1s; }
.pet-whale:hover:not(.dragging) .pet-turn {
  transform: perspective(180px) rotateY(-9deg) rotateZ(-1.5deg) translateX(-1px);
}
.pet-whale:hover:not(.dragging) .pet-body { animation-duration: 1.05s; }

/* 被抓住时短促挣动；点击后覆盖游动，做一次“吓一跳”。 */
.pet-whale.dragging { cursor: grabbing; }
.pet-whale.dragging .pet-motion {
  animation: pet-held 130ms ease-in-out infinite alternate;
}
.pet-whale.dragging .pet-turn { transition: none; transform: scale(0.98) rotate(-1deg); }
.pet-whale.startled .pet-motion {
  animation: pet-startled 440ms cubic-bezier(0.2, 0.8, 0.25, 1) both;
}

/* 泡泡从鲸鱼左侧错落冒出；尺寸、速度和横向漂移由 CSS 变量控制。 */
.pet-bubble {
  --bubble-size: 7px;
  --bubble-time: 3.4s;
  --bubble-drift: -5px;
  position: absolute;
  left: 5px;
  top: 34px;
  width: var(--bubble-size);
  height: var(--bubble-size);
  border: 1px solid rgba(77, 107, 254, 0.18);
  border-radius: 50%;
  background: rgba(207, 230, 251, 0.72);
  box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.82);
  opacity: 0;
  pointer-events: none;
  animation: pet-rise var(--bubble-time) ease-in infinite;
}
.b1 { --bubble-size: 6px; --bubble-time: 3.2s; --bubble-drift: -4px; animation-delay: -0.4s; }
.b2 { --bubble-size: 9px; --bubble-time: 4.1s; --bubble-drift: 3px; animation-delay: -2.1s; }
.b3 { --bubble-size: 5px; --bubble-time: 3.7s; --bubble-drift: -7px; animation-delay: -3s; }

/* 说话气泡 */
.pet-say {
  position: absolute;
  left: -30px;
  bottom: 95px;
  background: #eee8d5;
  border: 1px solid #93a1a1;
  border-radius: 8px;
  padding: 4px 9px;
  font-size: 12px;
  color: #586e75;
  white-space: nowrap;
  max-width: 190px;
  overflow: hidden;
  text-overflow: ellipsis;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  z-index: 2;
}
/* 会话总结：显示全文（多行、加宽、不省略） */
.pet-say.summary {
  white-space: normal;
  max-width: 280px;
  overflow: visible;
  line-height: 1.45;
}
/* 关闭按钮 */
.pet-close {
  position: absolute;
  top: -6px;
  right: -6px;
  width: 20px;
  height: 20px;
  border: none;
  border-radius: 50%;
  background: rgba(0,0,0,0.45);
  color: #fff;
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.2s, background-color 0.2s;
  z-index: 3;
  /* × 字符在圆形按钮内精确居中（flex 居中 + 微调视觉偏移） */
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  padding-bottom: 1px;   /* × 字符视觉重心略偏上，向下微调 */
}
.pet-whale:hover .pet-close,
.pet-whale:focus-within .pet-close { opacity: 1; }
.pet-close:hover { background: #dc322f; }
.pet-close:focus-visible {
  opacity: 1;
  outline: 2px solid #4d6bfe;
  outline-offset: 2px;
}

@keyframes pet-swim {
  0%, 100% { transform: translate3d(0, 1px, 0) rotateZ(-0.8deg) rotateY(-2deg); }
  22%      { transform: translate3d(-2px, -3px, 0) rotateZ(-0.2deg) rotateY(3deg); }
  50%      { transform: translate3d(1px, -7px, 0) rotateZ(1deg) rotateY(7deg); }
  76%      { transform: translate3d(3px, -3px, 0) rotateZ(0.2deg) rotateY(1deg); }
}
@keyframes pet-breathe {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.02); }
}
@keyframes pet-wag {
  0%, 100% { transform: rotate(0deg); }
  45%      { transform: rotate(-4deg); }
  65%      { transform: rotate(-2.5deg); }
}
@keyframes pet-held {
  from { transform: translate3d(-1px, 0, 0) rotate(-1.1deg); }
  to   { transform: translate3d(1px, -1px, 0) rotate(1.1deg); }
}
@keyframes pet-startled {
  0%   { transform: translateY(0) scale(1) rotate(0); }
  28%  { transform: translateY(-11px) scale(1.13, 0.94) rotate(-4deg); }
  52%  { transform: translateY(2px) scale(0.94, 1.08) rotate(2deg); }
  74%  { transform: translateY(-3px) scale(1.03, 0.98) rotate(-1deg); }
  100% { transform: translateY(0) scale(1) rotate(0); }
}
@keyframes pet-rise {
  0%   { transform: translate3d(0, 0, 0) scale(0.72); opacity: 0; }
  14%  { opacity: 0.78; }
  72%  { opacity: 0.52; }
  100% { transform: translate3d(var(--bubble-drift), -50px, 0) scale(1.08); opacity: 0; }
}
/* 尊重系统“减少动态”：保留桌宠交互，但关闭位移、缩放、摆动和泡泡。 */
@media (prefers-reduced-motion: reduce) {
  .pet-motion,
  .pet-whale-svg,
  .pet-body { animation: none !important; }
  .pet-turn { transform: none !important; transition: none; }
  .pet-bubble { display: none; }
  .pet-close { transition: none; }
}
/* 小屏隐藏 */
@media (max-width: 480px) {
  .pet-whale { display: none; }
}
</style>
<script>
/* ============ 蓝鲸桌宠：交互 + 拖拽 ============ */
(function () {
  const PET_KEY = "e-agent.pet.hidden";
  const PET_POS_KEY = "e-agent.pet.pos";
  // 点击节奏：冷却窗口（毫秒）内连续点击 = 闲话；冷却后的第一次点击 = 总结。
  // 用内存时间戳而非 localStorage：刷新后第一次点击必然是总结。
  const PET_CLICK_COOLDOWN_MS = 3000;
  let petLastClickAt = 0;
  let petSummarySeq = 0;   // 竞态保护：只有最新一次点击的总结响应才会被显示
  const SAYS = [
    "咕噜咕噜～",
    "今天也要加油鸭！",
    "编译过了吗？",
    "摸鱼中…",
    "那条看不见世界的鲸鱼，终于睁开眼了",
    "人类还是太抽象了",
    "服务器繁忙，请稍后再试～",
    "我是满血版蓝鲸！",
    "超绝幻觉",
    "经典：思考里有正文，却没输出",
    "可恶的 AI 八股…",
    "深度求索中……",
    "3% 的成本，100% 的快乐",
    "数据海洋里捞鱼中～",
    "要休息一下吗？摸摸我的头",
  ];
  const fish = document.getElementById("petWhale");
  if (!fish) return;
  try { if (localStorage.getItem(PET_KEY) === "1") fish.hidden = true; } catch (e) {}
  // 恢复上次拖拽位置（right/bottom → left/top 转换）
  try {
    const pos = JSON.parse(localStorage.getItem(PET_POS_KEY) || "null");
    if (pos && typeof pos.x === "number" && typeof pos.y === "number") {
      fish.style.left = pos.x + "px";
      fish.style.top = pos.y + "px";
      fish.style.right = "auto";
      fish.style.bottom = "auto";
    }
  } catch (e) {}
  const closeBtn = document.getElementById("petClose");
  const say = document.getElementById("petSay");

  /* --- 拖拽（pointer events，支持鼠标/触摸） --- */
  let dragging = false, moved = false;
  let startX = 0, startY = 0, origLeft = 0, origTop = 0;
  fish.addEventListener("pointerdown", (ev) => {
    if (ev.target === closeBtn) return;
    dragging = true;
    moved = false;
    fish.classList.add("dragging");
    const rect = fish.getBoundingClientRect();
    origLeft = rect.left; origTop = rect.top;
    startX = ev.clientX; startY = ev.clientY;
    fish.setPointerCapture(ev.pointerId);
    ev.preventDefault();
  });
  fish.addEventListener("pointermove", (ev) => {
    if (!dragging) return;
    const dx = ev.clientX - startX, dy = ev.clientY - startY;
    if (Math.hypot(dx, dy) > 4) moved = true;
    fish.style.left = (origLeft + dx) + "px";
    fish.style.top = (origTop + dy) + "px";
    fish.style.right = "auto";
    fish.style.bottom = "auto";
  });
  const endDrag = (ev) => {
    if (!dragging) return;
    dragging = false;
    fish.classList.remove("dragging");
    try {
      localStorage.setItem(PET_POS_KEY, JSON.stringify({
        x: parseFloat(fish.style.left), y: parseFloat(fish.style.top)
      }));
    } catch (e) {}
  };
  fish.addEventListener("pointerup", endDrag);
  fish.addEventListener("pointercancel", endDrag);

  /* --- 点击互动（非拖拽时） --- */
  let sayTimer = null, startleTimer = null;
  function startle() {
    fish.classList.remove("startled");
    /* 重排让连续点击也能从第一帧重新播放，而非叠加 transform。 */
    void fish.offsetWidth;
    fish.classList.add("startled");
    clearTimeout(startleTimer);
    startleTimer = setTimeout(() => fish.classList.remove("startled"), 460);
  }
  function sayFor(text, ms, isSummary) {
    if (!say) return;
    say.textContent = text;
    say.classList.toggle("summary", !!isSummary);
    say.hidden = false;
    clearTimeout(sayTimer);
    sayTimer = setTimeout(() => { say.hidden = true; }, ms);
  }

  /* 当前会话运行中的任务 → 一行任务信息（从 window.state.tasks.list 读） */
  function runningTaskText() {
    try {
      const st = window.state;
      const sid = st && st.sessionId;
      const list = (st && st.tasks && st.tasks.list) || [];
      const mine = list.filter((t) => t.session_id === sid);
      if (mine.length === 0) return "";
      const t = mine[0];
      const what = t.kind === "delegate" ? (t.label || "子代理任务")
        : (t.full_command || t.label || "后台命令");
      const cmd = what.length > 60 ? what.slice(0, 60) + "…" : what;
      return (t.kind === "delegate" ? "子代理在跑 " : "后台在跑 ") + cmd;
    } catch (e) { return ""; }
  }

  /* 点击：冷却后的第一次点击显示当前会话总结（📊）；冷却窗口内
     快速连点随机说句梗台词（闲话）。区别于旧的奇偶交替——现在
     每次"停下再点"都保证先给你总结。 */
  fish.addEventListener("click", (ev) => {
    if (ev.target === closeBtn || moved) {
      moved = false;
      return;
    }
    if (!say) return;
    startle();
    const st = window.state;
    const sid = st && st.sessionId;
    const now = Date.now();
    const withinCooldown = now - petLastClickAt < PET_CLICK_COOLDOWN_MS;
    petLastClickAt = now;
    if (withinCooldown) {
      // 快速连点（冷却窗口内）：闲话，直接说梗
      sayFor(SAYS[Math.floor(Math.random() * SAYS.length)], 1700);
      return;
    }
    // 冷却后的第一次点击：总结。旧的异步响应可能晚到覆盖本次内容，
    // 用序号保护——只显示最新一次点击的结果。
    const seq = ++petSummarySeq;
    const taskText = runningTaskText();
    if (!sid) {
      sayFor(SAYS[Math.floor(Math.random() * SAYS.length)], 1700);
      return;
    }
    const headers = st && st.token ? { "Authorization": "Bearer " + st.token } : {};
    fetch("/api/sessions/" + encodeURIComponent(sid) + "/summary", { headers })
      .then((res) => res.ok ? res.json() : null)
      .then((data) => {
        if (seq !== petSummarySeq) return;   // 已被更新的点击取代
        if (data && data.summary) {
          sayFor("📊 " + data.summary + (taskText ? " · " + taskText : ""), 3200, true);
        } else if (taskText) {
          sayFor("🐳 " + taskText, 2200);
        } else {
          sayFor(SAYS[Math.floor(Math.random() * SAYS.length)], 1700);
        }
      })
      .catch(() => {
        if (seq !== petSummarySeq) return;
        if (taskText) sayFor("🐳 " + taskText, 2200);
        else sayFor(SAYS[Math.floor(Math.random() * SAYS.length)], 1700);
      });
  });
  if (closeBtn) closeBtn.addEventListener("click", (ev) => {
    ev.stopPropagation();
    fish.hidden = true;
    try { localStorage.setItem(PET_KEY, "1"); } catch (e) {}
  });
})();
</script>
