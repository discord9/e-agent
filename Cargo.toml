[package]
name = "e-agent"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "A minimal OpenAI-compatible Rust coding agent"

[workspace]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
cap-std = "=4.0.2"
chrono = { version = "0.4", features = ["serde"] }
crossterm = { version = "0.29.0", features = ["event-stream", "bracketed-paste"] }
eventsource-stream = "0.2.3"
futures-util = "0.3.33"
ratatui = "0.30.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rand = "0.9"
rustix = { version = "=1.1.4", features = ["process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "net", "sync", "signal"] }
toml = "0.9"
unicode-width = "0.2.2"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"], optional = true }
turso = { version = "=0.7.2", optional = true }
url = "2"
webbrowser = "1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "e-agent-import-jsonl"
path = "src/bin/import_jsonl.rs"
required-features = ["greptime"]

# Windows-only APIs used by the restricted-token write sandbox and its
# degraded (top-level-process only) cancellation path.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[features]
default = ["greptime", "sqlite"]
greptime = ["dep:tokio-postgres"]
sqlite = ["dep:turso"]

[profile.release]
# 保留函数名以便 panic backtrace 可读（默认 strip=debuginfo 会把符号表剥掉，
# 崩溃日志全是 <unknown>）。debug=1 只留 line table，体积/性能影响极小。
debug = 1
