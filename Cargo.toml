[package]
name = "e-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A minimal OpenAI-compatible Rust coding agent"

[workspace]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1"
base64 = "0.22"
cap-std = "=4.0.2"
chrono = { version = "0.4", features = ["serde"] }
crossterm = { version = "0.29.0", features = ["event-stream", "bracketed-paste"] }
eventsource-stream = "0.2.3"
futures-util = "0.3.33"
ratatui = "0.30.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rand = "0.9"
rustix = { version = "=1.1.4", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "net", "sync"] }
toml = "0.9"
unicode-width = "0.2.2"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"], optional = true }
url = "2"
webbrowser = "1"

[dev-dependencies]
tempfile = "3"

[features]
greptime = ["dep:tokio-postgres"]
