[package]
name = "e-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A minimal OpenAI-compatible Rust coding agent"

[workspace]

[dependencies]
async-trait = "0.1"
cap-std = "=4.0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustix = { version = "=1.1.4", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "net"] }

[dev-dependencies]
tempfile = "3"
