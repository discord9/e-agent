[package]
name = "poc-harness"
version = "0.1.0"
edition = "2021"

[dependencies]
greptimedb-ingester = "0.18"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
anyhow = "1"
opentelemetry-proto = { version = "0.30", default-features = false, features = ["gen-tonic-messages", "trace", "metrics", "logs"] }
prost = "0.13"

[profile.dev]
opt-level = 1

[workspace]
